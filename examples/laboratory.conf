{- Laboratory temperature monitoring configuration. -}
21.50 -> REFERENCE
'degrees Celsius' -> UNIT
$[
    EXPERIMENT: 'Room monitoring',
    SENSOR: $[
        MODEL: 'T & H <logger>',
        CALIBRATION: $[OFFSET: -0.25, SCALE: 1.0],
    ],
    LIMITS: $[LOW: 18.0, HIGH: 25.0, REFERENCE: @(REFERENCE)],
    UNITS: @(UNIT),
]
