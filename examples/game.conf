{- Screen and player settings for a game. -}
$[WIDTH: 1280.0, HEIGHT: 720.0] -> SCREEN
$[
    TITLE: 'Space runner',
    DISPLAY: @(SCREEN),
    PLAYER: $[
        100.0 -> SPEED,
        NAME: 'Pilot',
        MOVEMENT: $[SPEED: @(SPEED), ACCELERATION: +2.5],
        HEALTH: 100.0,
    ],
    SCORE: $[INITIAL: 0.0, MULTIPLIER: 1.5],
]
