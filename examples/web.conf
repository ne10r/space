{- Configuration of a web service and its database. -}
'api.example.test' -> HOST
8080.0 -> PORT
$[
    APPLICATION: 'Gateway',
    HTTP: $[
        HOST: @(HOST),
        PORT: @(PORT),
        TIMEOUT: 2.5,
    ],
    DATABASE: $[
        HOST: 'postgres',
        PORT: 5432.0,
        POOL: $[MIN: 2.0, MAX: 10.0],
    ],
]
